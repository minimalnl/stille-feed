name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * *' # daily: refresh Burnt Pix thumbnails (iterations change over time)
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Burnt Pix thumbnails
        # If this fails the site still deploys; app.js then falls back to live on-chain loading.
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock sharp@0.33.5
          node scripts/build-thumbs.mjs
          rm -rf node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stille feed</title>
<link rel="icon" href="sun.svg" type="image/svg+xml">
<link rel="preconnect" href="https://rpc.mainnet.lukso.network" crossorigin>
<link rel="preconnect" href="https://api.universalprofile.cloud">
<link rel="dns-prefetch" href="https://www.forevermoments.life">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<main class="wrap">
  <div id="chrome" class="chrome">
  <header class="top">
    <img class="mark" src="sun.svg" alt="" width="44" height="44">
    <div>
      <h1>stille feed</h1>
      <p class="sub">One Universal Profile. Moments, posts, and Burnt Pix — nothing loud.</p>
    </div>
  </header>

  <form id="form" class="search" autocomplete="off">
    <label for="addr" class="sr">Universal Profile address</label>
    <input id="addr" name="address" placeholder="0x… Universal Profile address" spellcheck="false">
    <button type="submit">View</button>
  </form>
  <p id="formError" class="hint" hidden></p>
  </div>
  <button id="chromeToggle" class="chrome-toggle" type="button" aria-controls="chrome" aria-expanded="true">hide header</button>

  <section id="pixFocus" class="pixfocus" hidden aria-label="Burnt Pix"></section>
  <button id="pixNext" class="pix-next" type="button" hidden aria-label="Next Burnt Pix"><span aria-hidden="true">→</span></button>

  <section id="profile" class="profile" aria-live="polite"></section>

  <section id="pixSection" class="pixsec" hidden>
    <div class="sechead"><h2>Burnt Pix</h2><span id="pixCount"></span></div>
    <div id="pixGrid" class="pixgrid"></div>
    <div id="pixFoot"></div>
  </section>

  <section id="social" class="social" hidden>
    <div class="social-head">
      <nav class="filters" id="filters">
        <button data-f="all">All</button>
        <button data-f="moment" class="on">Moments</button>
        <button data-f="hup">Hup</button>
      </nav>
      <button id="socialToggle" class="social-toggle" type="button" aria-expanded="true" aria-controls="socialBody" aria-label="Hide posts"><svg class="social-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><mask id="socialSkull"><rect width="24" height="24" fill="#000"/><path fill="#fff" d="M12 1.6c-4.6 0-8.1 3.4-8.1 7.9 0 2.6 1.2 4.7 3.1 6.1V18c0 .7.6 1.3 1.3 1.3h1.5V22h1.7v-2.7h1v2.7h1.7V19.3h1.5c.7 0 1.3-.6 1.3-1.3v-2.4c1.9-1.4 3.1-3.5 3.1-6.1 0-4.5-3.5-7.9-8.1-7.9z"/><circle cx="9.2" cy="9.7" r="1.7" fill="#000"/><circle cx="14.8" cy="9.7" r="1.7" fill="#000"/><path fill="#000" d="M11.1 13.2h1.8L12 15.1z"/></mask><rect width="24" height="24" fill="currentColor" mask="url(#socialSkull)"/></svg></button>
    </div>
    <div id="socialBody">
      <section id="feed" class="feed" aria-live="polite"></section>
      <p id="status" class="status"></p>
    </div>
  </section>

  <button id="ggHint" class="gg-hint" type="button" aria-expanded="false" aria-controls="gg"><span class="gg-mark" aria-hidden="true"></span>Generative Square</button>
  <aside id="gg" class="gg" hidden aria-label="Generative Square">
    <div class="gg-art"><iframe id="ggArt" sandbox="allow-scripts" title="Generative Square, live preview"></iframe>
      <button id="ggNew" class="gg-new" title="New preview" aria-label="New preview">↻</button></div>
    <div class="gg-info">
      <button id="ggClose" class="gg-close" type="button">close</button>
      <span class="gg-label">Tip the creator</span>
      <h2>Generative Square</h2>
      <p class="gg-sub">One square, every mint its own seed. Script and seed live on&#8209;chain.</p>
      <div class="gg-row"><span id="ggCount">…</span><span id="ggPrice"></span></div>
      <div class="gg-act">
        <div id="ggQty" class="gg-qty" role="group" aria-label="How many to mint" hidden>
          <button type="button" data-q="1">1</button><button type="button" data-q="2">2</button><button type="button" data-q="3">3</button><button type="button" data-q="4">4</button><button type="button" data-q="5">5</button>
        </div>
        <button id="ggMint" class="gg-mint" type="button" hidden>Mint</button>
      </div>
      <p id="ggNote" class="gg-note"></p>
      <div class="gg-claim">
        <button id="ggClaim" class="gg-claim-btn" type="button" hidden>Claim revenue</button>
        <p id="ggClaimNote" class="gg-claim-note"></p>
        <button id="ggFix" class="gg-claim-btn" type="button" hidden>Fix images for UE</button>
        <p id="ggFixNote" class="gg-claim-note"></p>
        <button id="ggHeader" class="gg-claim-btn" type="button" hidden>Set collection header</button>
        <p id="ggHeaderNote" class="gg-claim-note"></p>
      </div>
    </div>
  </aside>

  <footer class="foot">
    <span>The feed is read-only.</span>
    <span>Sources: LUKSO mainnet · Forever Moments · Hup</span>
  </footer>
</main>

<div class="theme-switch">
  <button type="button" class="theme-toggle" aria-expanded="false" aria-controls="themeMenu" aria-label="Theme">
    <span class="theme-swatch" aria-hidden="true"></span>
  </button>
  <div id="themeMenu" class="theme-menu" hidden>
    <button type="button" data-theme="zwart" aria-label="Black theme">Black</button>
    <button type="button" data-theme="wit" aria-label="White theme">White</button>
    <button type="button" data-theme="kunstobject" aria-label="Art theme" class="active">Art</button>
  </div>
</div>

<script src="pix-link.js" defer></script>
<script src="app.js" defer></script>
<script src="grid-ad.js" defer></script>
</body>
</html>

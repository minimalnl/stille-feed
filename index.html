<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stille feed</title>
<link rel="icon" href="sun.svg" type="image/svg+xml">
<link rel="preconnect" href="https://rpc.mainnet.lukso.network" crossorigin>
<link rel="preconnect" href="https://api.universalprofile.cloud">
<link rel="dns-prefetch" href="https://www.forevermoments.life">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <div id="chrome" class="chrome">
  <header class="top">
    <img class="mark" src="sun.svg" alt="" width="44" height="44">
    <div>
      <h1>stille feed</h1>
      <p class="sub">One Universal Profile. Moments, posts, and Burnt Pix — nothing loud.</p>
    </div>
  </header>

  <form id="form" class="search" autocomplete="off">
    <label for="addr" class="sr">Universal Profile address</label>
    <input id="addr" name="address" placeholder="0x… Universal Profile address" spellcheck="false">
    <button type="submit">View</button>
  </form>
  <p id="formError" class="hint" hidden></p>
  </div>
  <button id="chromeToggle" class="chrome-toggle" type="button" aria-controls="chrome" aria-expanded="true">hide header</button>

  <section id="profile" class="profile" aria-live="polite"></section>

  <section id="pixSection" class="pixsec" hidden>
    <div class="sechead"><h2>Burnt Pix</h2><span id="pixCount"></span></div>
    <div id="pixGrid" class="pixgrid"></div>
    <div id="pixFoot"></div>
  </section>

  <nav class="filters" id="filters" hidden>
    <button data-f="all">All</button>
    <button data-f="moment" class="on">Moments</button>
    <button data-f="hup">Hup</button>
  </nav>

  <section id="feed" class="feed" aria-live="polite"></section>
  <p id="status" class="status"></p>

  <aside id="gg" class="gg" hidden aria-label="Generative Square">
    <div class="gg-art"><iframe id="ggArt" sandbox="allow-scripts" title="Generative Square, live preview" loading="lazy"></iframe>
      <button id="ggNew" class="gg-new" title="New preview" aria-label="New preview">↻</button></div>
    <div class="gg-info">
      <span class="gg-label">Tip the creator</span>
      <h2>Generative Square</h2>
      <p class="gg-sub">One square, every mint its own seed. Script and seed live on&#8209;chain.</p>
      <div class="gg-row"><span id="ggCount">…</span><span id="ggPrice"></span></div>
      <div class="gg-act">
        <div id="ggQty" class="gg-qty" role="group" aria-label="How many to mint" hidden>
          <button type="button" data-q="1">1</button><button type="button" data-q="2">2</button><button type="button" data-q="3">3</button><button type="button" data-q="4">4</button><button type="button" data-q="5">5</button>
        </div>
        <button id="ggMint" class="gg-mint" type="button" hidden>Mint</button>
      </div>
      <p id="ggNote" class="gg-note"></p>
      <div class="gg-claim">
        <button id="ggClaim" class="gg-claim-btn" type="button" hidden>Claim revenue</button>
        <p id="ggClaimNote" class="gg-claim-note"></p>
        <button id="ggFix" class="gg-claim-btn" type="button" hidden>Fix images for UE</button>
        <p id="ggFixNote" class="gg-claim-note"></p>
      </div>
    </div>
  </aside>

  <footer class="foot">
    <span>The feed is read-only.</span>
    <span>Sources: LUKSO mainnet · Forever Moments · Hup</span>
  </footer>
</main>
<script src="app.js" defer></script>
<script src="grid-ad.js" defer></script>
</body>
</html>
